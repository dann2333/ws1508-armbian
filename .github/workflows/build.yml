name: Build WS1508 Armbian

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Userland release'
        required: true
        default: 'trixie'
        type: choice
        options:
          # Armbian marks trixie, noble and resolute "supported" and bookworm
          # community-supported (config/distributions/*/support).
          - trixie      # Debian 13 (default)
          - bookworm    # Debian 12
          - noble       # Ubuntu 24.04 LTS
          - resolute    # Ubuntu 26.04 LTS
      kernel_branch:
        description: 'Armbian kernel branch'
        required: true
        default: 'current'
        type: choice
        options:
          # 'current' is the only option on purpose: Armbian's meson family
          # (config/sources/families/include/meson_common.inc) sets
          # KERNELBRANCH for the 'current' case alone, so asking for 'edge'
          # leaves it unset and the build fails partway through.
          - current
      build_type:
        description: 'Image size'
        required: true
        default: 'minimal'
        type: choice
        options:
          - minimal     # recommended: this board has 512MB of RAM and 4GB of storage
          - cli
      root_password:
        description: 'Default root password baked into the image'
        required: false
        default: '1234'
      ssh_authorized_key:
        description: 'Optional SSH public key to install for root'
        required: false
        default: ''
      publish_release:
        description: 'Publish the result as a GitHub Release'
        required: true
        default: true
        type: boolean

  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - '.github/workflows/build.yml'
      - 'uboot/**'
      - 'userpatches/**'
      - 'scripts/**'

permissions:
  contents: write

# One image build at a time per branch. A full run takes over an hour, so
# without this a quick series of pushes stacks several of them on top of
# each other and the earlier ones are pure waste.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  # Everything heavy goes on the runner's large scratch disk; the root
  # filesystem does not have room for an Armbian build.
  WORKDIR: /mnt/ws1508/work
  OUTDIR: /mnt/ws1508/out

jobs:
  # ---------------------------------------------------------------------
  # The bootloader. Small and quick (~3 minutes), and it is what makes the
  # image flashable to internal storage at all, so it is built first and
  # independently: if this fails there is no point building an image.
  # ---------------------------------------------------------------------
  uboot:
    name: Build bootloader
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare scratch space
        run: |
          sudo mkdir -p "${WORKDIR}" "${OUTDIR}"
          sudo chown -R "$(id -u):$(id -g)" /mnt/ws1508

      - name: Install build dependencies
        run: |
          # The Amlogic vendor toolchain bundled with the u-boot tree is a
          # 32-bit x86 binary, hence the i386 multiarch libraries.
          sudo dpkg --add-architecture i386
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            build-essential git curl xz-utils \
            libc6:i386 zlib1g:i386 libstdc++6:i386

      - name: Build u-boot and pack the bootloader burn image
        run: bash scripts/build-uboot.sh

      - name: Upload bootloader
        uses: actions/upload-artifact@v7
        with:
          name: ws1508-uboot
          path: |
            /mnt/ws1508/out/uboot/ws1508-uboot.burn.img
            /mnt/ws1508/out/uboot/burn-base/**
          retention-days: 14
          if-no-files-found: error

  # ---------------------------------------------------------------------
  # The Armbian image, plus the combined direct-flash burn package.
  # ---------------------------------------------------------------------
  image:
    name: Build image (${{ inputs.release || 'trixie' }} / ${{ inputs.build_type || 'minimal' }})
    needs: uboot
    runs-on: ubuntu-24.04
    outputs:
      image_name: ${{ steps.collect.outputs.image_name }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Free up disk space
        run: |
          # An Armbian build wants ~25GB. The runner's root filesystem does
          # not have that spare, but /mnt does; still, reclaim the obvious
          # dead weight so apt and docker have room.
          echo "Before:"; df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/lib/jvm \
                      "${AGENT_TOOLSDIRECTORY:-/opt/hostedtoolcache}" || true
          sudo apt-get -qq purge -y '^dotnet-.*' '^llvm-.*' '^mysql-.*' '^mongodb-.*' \
                                    azure-cli google-chrome-stable firefox 2>/dev/null || true
          sudo apt-get -qq autoremove -y || true
          sudo apt-get -qq clean || true
          echo "After:"; df -h / /mnt

      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare scratch space
        run: |
          sudo mkdir -p "${WORKDIR}" "${OUTDIR}/uboot" "${OUTDIR}/images"
          sudo chown -R "$(id -u):$(id -g)" /mnt/ws1508

      - name: Download bootloader
        uses: actions/download-artifact@v8
        with:
          name: ws1508-uboot
          path: /mnt/ws1508/out/uboot

      - name: Install build dependencies
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends \
            git curl xz-utils zstd jq python3 apt-utils \
            android-sdk-libsparse-utils device-tree-compiler

      - name: Build metadata
        id: meta
        run: |
          created="$(date -u +'%Y%m%d-%H%M%S')"
          echo "tag=build-${created}" >> "$GITHUB_OUTPUT"
          echo "name=WS1508 Armbian ${created}" >> "$GITHUB_OUTPUT"
          # The same instant, as the suffix build-armbian.sh appends to every
          # package version, so a package names the release it came from.
          echo "stamp=${created//-/}" >> "$GITHUB_OUTPUT"

      - name: Build the Armbian image
        env:
          BOARD: ws1508
          BRANCH: ${{ inputs.kernel_branch || 'current' }}
          RELEASE: ${{ inputs.release || 'trixie' }}
          BUILD_MINIMAL: ${{ (inputs.build_type == 'cli') && 'no' || 'yes' }}
          WS1508_ROOT_PASSWORD: ${{ inputs.root_password || '1234' }}
          WS1508_SSH_AUTHORIZED_KEY: ${{ inputs.ssh_authorized_key }}
          WS1508_TIMEZONE: Asia/Shanghai
          WS1508_BUILD_STAMP: ${{ steps.meta.outputs.stamp }}
        run: |
          sudo -E bash scripts/build-armbian.sh build

      # The update channel: the kernel, device-tree and board-support
      # packages as a flat apt repository, published with the release so
      # that boxes in the field upgrade with apt instead of a reflash.
      - name: Lay out the apt repository
        run: sudo -E bash scripts/make-apt-repo.sh

      - name: Pack the direct-flash burn image
        run: sudo -E bash scripts/make-burn-image.sh

      # The NAND kernel package. Must run before the image is compressed
      # below, because it reads the kernel, initrd and dtb back out of the
      # built .img's boot partition.
      #
      # Kept as a build artifact for experimenters, and deliberately NOT
      # published with the release: the only WS1508 NAND chip reported so
      # far (a Hynix H27UBG8T2C, issue #2) is MLC with 8KiB pages, which UBI
      # refuses and this driver cannot read, so the package cannot complete
      # an install on known hardware -- while flashing it costs the erase,
      # and the erase costs the unit's nkey/nsec.
      - name: Pack the NAND boot image
        run: sudo -E bash scripts/make-nand-image.sh

      - name: Upload the experimental NAND package
        uses: actions/upload-artifact@v7
        with:
          name: ws1508-nand-experimental
          path: |
            /mnt/ws1508/out/nand/ws1508-nand.burn.img
            /mnt/ws1508/out/nand/ws1508-nand-boot.andr
          retention-days: 14
          if-no-files-found: warn

      - name: Collect artifacts
        id: collect
        run: |
          sudo chown -R "$(id -u):$(id -g)" /mnt/ws1508
          cd "${OUTDIR}"

          # The bootloader-only package belongs next to the images: it is
          # what raw-NAND owners need first.
          cp uboot/ws1508-uboot.burn.img images/

          # The apt repository goes up as release assets too: every release
          # is a complete repository, and the source boxes use points at
          # releases/latest/download/. Copied, not optional -- a release
          # without it would leave every box that follows the channel on
          # its current version.
          cp apt/* images/

          cd images

          # GitHub Actions runs steps with `-o pipefail`, so avoid piping
          # into `head` here: it would exit early and SIGPIPE the producer.
          img=""
          for f in *.img; do
            case "$f" in *.burn.img) continue ;; esac
            img="$f"
            break
          done
          [ -n "$img" ] || { echo "::error::no Armbian .img was produced"; exit 1; }
          echo "image_name=${img%.img}" >> "$GITHUB_OUTPUT"

          # Compress the big raw image; leave the burn packages uncompressed
          # because the USB Burning Tool has to open them directly.
          xz -T0 -6 "${img}"

          sha256sum -- * > ../sha256sums.txt
          mv ../sha256sums.txt .
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ws1508-${{ inputs.release || 'trixie' }}-${{ inputs.build_type || 'minimal' }}
          path: /mnt/ws1508/out/images/*
          retention-days: 30
          if-no-files-found: error

      - name: Write release notes
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        run: |
          cd "${OUTDIR}/images"
          cat > /tmp/release.md <<'EOF'
          ## 迅雷赚钱宝二代 (WS1508) Armbian

          Amlogic S805 / meson8b · 512MB RAM · 100M 网口 · 1x USB 2.0

          ### 已经在用旧版本？不用重刷

          SSH 进去跑下面三行，开启更新通道并把内核升到这一版。之后就和普通
          Armbian 一样用 `apt` 升级，内核和设备树一起更新，数据不动：

          ```
          curl -fLO https://github.com/dann2333/ws1508-armbian/releases/latest/download/ws1508-apt-setup.sh
          sudo bash ws1508-apt-setup.sh
          sudo reboot
          ```

          **所有老设备都建议尽快跑一次**，哪怕暂时不想升级（那就用
          `sudo bash ws1508-apt-setup.sh pin`）：Armbian 官方源里有同名的
          `linux-image-current-meson` / `linux-dtb-current-meson`，但不带
          WS1508 的设备树。官方一旦发布 26.11.1 或更高版本，老镜像上一次
          普通的 `apt upgrade` 就会装上它，机器随即无法启动。这个脚本装的
          pin 就是防这个的。详见 `docs/upgrading.md`。

          这一版起刷的新镜像已经自带更新通道和 pin，以后直接
          `apt update && apt full-upgrade` 即可。

          ### 下载哪个文件？

          **不确定就照这两个来。** 两种机器都适用，也不动内置存储里的数据：

          1. `ws1508-uboot.burn.img` — 用 USB Burning Tool 刷入，换掉原厂引导
          2. `Armbian-*.img.xz` — 解压后写入 U 盘

          开机后跑 `ws1508-info`，它会报出机器是 eMMC 版还是 NAND 版。

          | 文件 | 给谁 | 说明 |
          |---|---|---|
          | `ws1508-uboot.burn.img` | 所有人 | 1.4MB，只换引导 |
          | `Armbian-*.img.xz` | 所有人 | 写 U 盘/SD 卡启动 |
          | `Armbian-*.burn.img` | **仅 eMMC 版** | 引导 + 系统一次刷进 eMMC |
          | `*.deb`、`Packages*`、`Release` | 不用手动下载 | apt 更新通道的仓库文件 |
          | `ws1508-apt-setup.sh` | 已装旧版本的机器 | 开启更新通道，见上 |

          `.burn.img` 都用 **Amlogic USB Burning Tool** 刷入。详细步骤见
          `docs/flashing.md`。

          ⚠️ **别把 `Armbian-*.burn.img` 刷进 NAND 版。** 它的 `boot` 是 FAT
          分区镜像，会盖掉 NAND 里的内容；`rootfs` 经厂商 NFTL 写下去，Linux
          读不回来。

          ⚠️ **NAND 版刷本项目的引导必须勾「擦除 flash」**，`ws1508-uboot.burn.img`
          也一样。本项目改了 NAND 分区表，不勾擦除时烧录工具用
          `store init 1` 初始化存储，分区表对不上会直接失败，整个刷机过程根本
          起不来。代价是一机一份的 `nkey`/`nsec` 永久丢失、无法恢复。
          eMMC 版不受这条影响。**分不清自己是哪个版本就先不勾直接刷**：刷成功
          说明是 eMMC 版；卡在初始化存储那一步失败，说明是 NAND 版，勾上擦除
          再刷一次。详见 `docs/flashing.md`。

          ### NAND 版：系统跑在 U 盘上

          第一份 WS1508 NAND 版实测（issue #2）显示闪存是海力士
          **H27UBG8T2C**：MLC、8KB 页。UBI 拒绝挂载 MLC，主线驱动在 S805 上
          也读不了 8KB 页，所以**系统装不进内置 NAND**，U 盘启动就是这类机器
          的正式用法。旧内核会把这颗芯片误认成 4KB 页，在
          `meson_nand.allow_write=1` 下擦写会落到错误的物理块上 —— 这一版的
          内核已改为正确识别并拒绝挂载，`ws1508-install-to-nand` 也会在擦除前
          就拒绝 MLC。NAND 安装包因此不再随 Release 发布。

          ### 默认登录

          - 用户名 `root`
          - 密码见下方构建参数（默认 `1234`）
          - 开机自动启动 SSH，直接 `ssh root@<设备IP>` 即可，无需接显示器或串口

          **刷完请立刻 `passwd` 修改密码。**

          ### 构建参数
          EOF
          {
            echo ""
            echo "- Release: \`${{ inputs.release || 'trixie' }}\`"
            echo "- Kernel branch: \`${{ inputs.kernel_branch || 'current' }}\`"
            echo "- Image type: \`${{ inputs.build_type || 'minimal' }}\`"
            echo "- Package version (what apt shows): \`$(cat "${OUTDIR}/revision" 2>/dev/null || echo unknown)\`"
            echo "- Armbian build framework: \`$(cat "${OUTDIR}/armbian-commit" 2>/dev/null || echo unknown)\`"
            echo ""
            echo "### SHA256"
            echo ""
            echo '```'
            cat sha256sums.txt
            echo '```'
          } >> /tmp/release.md
          cat /tmp/release.md

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          body_path: /tmp/release.md
          target_commitish: ${{ github.sha }}
          files: /mnt/ws1508/out/images/*
          fail_on_unmatched_files: true
          # The update channel follows releases/latest, so a new release
          # must become "latest" -- said explicitly rather than left to the
          # API default.
          make_latest: true
