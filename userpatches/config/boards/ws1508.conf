# Xunlei WS1508 (迅雷赚钱宝二代 / Pro)
# Amlogic S805 (meson8b), 4x Cortex-A5 @1.5GHz, 512MB DDR3,
# 4GB internal storage (raw NAND on early units, eMMC on later ones),
# 100Mbit ethernet, 1x USB 2.0.
BOARD_NAME="WS1508"
BOARD_VENDOR="xunlei"
BOARDFAMILY="meson8b"
BOARD_MAINTAINER=""
INTRODUCED="2015"
KERNEL_TARGET="current"
KERNEL_TEST_TARGET="current"

# The bootloader is not built by Armbian. It is the Amlogic vendor u-boot
# from this repository's uboot/ directory, flashed to the device's boot
# area with the USB Burning Tool. See docs/flashing.md.
BOOTCONFIG="none"
BOOTSCRIPT="boot-ws1508.cmd:boot.cmd"
BOOTENV_FILE="ws1508.txt"

# Build the meson8b raw-NAND driver as a module and ship the NAND-variant
# dtb. The driver never binds unless the running device tree enables an
# amlogic,meson8b-nfc node, and only meson8b-ws1508-nand.dtb does -- so
# runtime behaviour on an eMMC unit, and on a NAND unit that has not
# opted in, is unchanged.
#
# "Unchanged behaviour" is not "unchanged image", and this is the place
# where that is decided, so be precise about what every image now carries:
#   - the kernel gets MTD, MTD_OF_PARTS and MTD_RAW_NAND built in, plus
#     meson_nand as a module (see userpatches/extensions/ws1508-nand.sh);
#   - the rootfs gets mtd-utils, which is the combined Debian package and
#     therefore includes write tooling (see userpatches/customize-image.sh);
#   - the boot partition gets a second dtb.
# None of that is exercised without the fdtfile= opt-in, but an eMMC
# image built before and after this change is not byte-identical.
enable_extension "ws1508-nand"

# Leave the first 16 MiB alone: on eMMC units that region holds the
# bootloader and the Amlogic reserved area.
OFFSET="16"
BOOTSIZE="256"
BOOTFS_TYPE="fat"

BOOT_LOGO=desktop

family_tweaks() {
	cp "$SRC/packages/blobs/splash/armbian-u-boot-24.bmp" "$SDCARD/boot/boot.bmp"
}
